version: 2

models:
  - name: dim_customer
    description: "GOLD - one row per customer."
    columns:
      - name: customer_key
        description: Primary key.
        data_tests: [unique, not_null]

  - name: dim_product
    description: "GOLD - one row per product, with the category hierarchy denormalised."
    columns:
      - name: product_key
        description: Primary key.
        data_tests: [unique, not_null]
      - name: unit_margin
        description: unit_price - unit_cost at current prices.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: dim_store
    description: "GOLD - one row per store."
    columns:
      - name: store_key
        description: Primary key. 0 = online channel.
        data_tests: [unique, not_null]
      - name: is_online
        data_tests: [not_null]

  - name: dim_date
    description: "GOLD - generated calendar, one row per day from 2015-01-01 to 2022-12-31."
    columns:
      - name: date_key
        description: Primary key, yyyymmdd as an integer.
        data_tests: [unique, not_null]
      - name: full_date
        data_tests: [unique, not_null]

  - name: fact_sales
    description: >
      GOLD - sales fact at ORDER LINE grain. Measures use current product
      price/cost (the source has no transaction-time price); all amounts USD.
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "gross_margin = gross_sales - gross_cost"
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, line_item]
    columns:
      - name: sales_key
        description: Surrogate key, md5(order_id, line_item).
        data_tests: [unique, not_null]
      - name: order_id
        description: Order identifier; one order spans 1-7 fact rows.
        data_tests: [not_null]
      - name: date_key
        description: Order date FK.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: delivery_date_key
        description: >
          Delivery date FK, NULL for in-store orders. The conditional rule is
          asserted by tests/assert_delivery_only_for_online_orders.sql.
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key
      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 10
              inclusive: true
      - name: unit_price
        description: Not null proves the product join found a match for every line.
        data_tests: [not_null]
      - name: unit_cost
        data_tests: [not_null]
      - name: gross_sales
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: gross_cost
        data_tests: [not_null]
      - name: gross_margin
        data_tests: [not_null]
